<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 登录</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307c160'/%3E%3Cpath d='M16 7l3 6h-6zM9.5 20l2.5-5h8l2.5 5z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
            background:
                radial-gradient(720px 340px at 18% 8%, rgba(7, 193, 96, 0.09), transparent 65%),
                radial-gradient(720px 340px at 85% 92%, rgba(16, 174, 255, 0.08), transparent 65%);
        }
        .login-card {
            background: #fff; border-radius: 20px; box-shadow: var(--shadow-lg);
            padding: 44px 38px; width: 100%; max-width: 390px; border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .login-card h2 { text-align: center; font-size: 23px; font-weight: 750; margin-bottom: 30px; }
        .login-card h2::before {
            content: ""; display: block; width: 52px; height: 52px; margin: 0 auto 18px;
            border-radius: 15px; background:
                linear-gradient(#fff, #fff) center 14px / 22px 3.6px no-repeat,
                linear-gradient(#fff, #fff) center 23px / 22px 3.6px no-repeat,
                linear-gradient(#fff, #fff) center 32px / 16px 3.6px no-repeat,
                linear-gradient(135deg, #07c160, #05b053);
            box-shadow: 0 10px 24px rgba(7, 193, 96, 0.24);
        }
        .tip { background: var(--gray-50); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--gray-500); margin-top: 16px; line-height: 1.6; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: var(--primary-deep); text-decoration: none; font-size: 14px; font-weight: 550; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>管理后台</h2>
        <form onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="password">管理密码</label>
                <input type="password" id="password" placeholder="请输入管理密码" required autofocus autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%">登 录</button>
        </form>
        {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}
        <p class="error-msg" id="errorMsg"></p>
        <div class="tip">首次使用默认密码 admin123，登录后请立即在右上角"修改密码"中更换并妥善保管。连续输错 5 次将被暂时锁定。</div>
        <div class="back-link"><a href="/">← 返回学生端</a></div>
    </div>
    <script>
    async function handleLogin(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
            const res = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: document.getElementById('password').value })
            });
            const data = await res.json();
            if (data.success) { location.href = '/admin'; return; }
            document.getElementById('errorMsg').textContent = data.message;
        } catch (err) {
            document.getElementById('errorMsg').textContent = '网络错误，请重试';
        }
        btn.disabled = false;
        return false;
    }
    </script>
</body>
</html>
