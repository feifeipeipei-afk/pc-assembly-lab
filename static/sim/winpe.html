<!DOCTYPE html>
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinPE 模拟考试系统</title>
<link rel="stylesheet" href="/static/sim/sim.css">
<!-- 考试公共层必须早于主脚本：主脚本启动时会用到 SimExam -->
<script src="/static/sim/sim_common.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; font-family:"Microsoft YaHei","Segoe UI",sans-serif; background:#000; }
#screen { position:relative; width:100%; height:100%; background:linear-gradient(135deg,#0b2545 0%,#13315c 40%,#1d4e89 100%); overflow:hidden; }
/* ---------- 桌面 ---------- */
#desktop { position:absolute; inset:0 0 40px 0; }
.dicon { position:absolute; width:92px; text-align:center; cursor:pointer; padding:6px 2px; border-radius:4px; }
.dicon:hover { background:rgba(255,255,255,.15); outline:1px solid rgba(255,255,255,.25); }
.dicon .ico { font-size:40px; line-height:1; text-shadow:0 2px 6px rgba(0,0,0,.6); }
.dicon .lbl { color:#fff; font-size:12px; margin-top:5px; text-shadow:0 1px 3px #000; word-break:break-all; }
/* ---------- 任务栏 ---------- */
#taskbar { position:absolute; left:0; right:0; bottom:0; height:40px; background:rgba(10,20,35,.92); border-top:1px solid rgba(255,255,255,.15); display:flex; align-items:center; padding:0 8px; z-index:500; }
#startbtn { width:44px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:4px; cursor:pointer; color:#7ec8ff; font-weight:bold; font-size:18px; }
#startbtn:hover { background:rgba(255,255,255,.15); }
#clock { margin-left:auto; color:#fff; font-size:12px; text-align:center; line-height:1.3; }
.tbtn { color:#e8e8e8; font-size:12px; padding:4px 10px; border-radius:3px; margin-left:4px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); cursor:pointer; }
.tbtn.active { background:rgba(90,160,255,.45); }
/* ---------- 开始菜单 ---------- */
#startmenu { position:absolute; left:4px; bottom:42px; width:300px; background:#12233b; border:1px solid #3a5a8a; border-radius:6px; box-shadow:0 8px 30px rgba(0,0,0,.7); display:none; z-index:600; padding:8px 0; }
#startmenu.open { display:block; }
.smitem { padding:9px 18px; color:#e8eef8; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:10px; }
.smitem:hover { background:#1d4e89; }
.smitem .si { width:24px; text-align:center; }
.smsep { height:1px; background:#2a4468; margin:5px 0; }
.smhead { color:#8fb4e0; font-size:11px; padding:6px 18px; letter-spacing:2px; }
/* ---------- 窗口 ---------- */
.win { position:absolute; min-width:420px; min-height:280px; background:#f0f0f0; border:1px solid #7a7a7a; box-shadow:0 10px 40px rgba(0,0,0,.6); border-radius:6px 6px 0 0; display:flex; flex-direction:column; z-index:100; }
.win.max { left:0!important; top:0!important; width:100%!important; height:calc(100% - 40px)!important; border-radius:0; }
.titlebar { height:30px; background:linear-gradient(#3266b0,#27538f); color:#fff; display:flex; align-items:center; padding:0 4px 0 10px; font-size:13px; cursor:move; flex-shrink:0; }
.titlebar .t { flex:1; white-space:nowrap; overflow:hidden; }
.wbtn { width:34px; height:26px; display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; font-size:13px; border-radius:3px; }
.wbtn:hover { background:rgba(255,255,255,.25); }
.wbtn.close:hover { background:#d9403a; }
.wbody { flex:1; overflow:auto; background:#f0f0f0; }
/* ---------- DiskGenius 界面 ---------- */
.dg { display:flex; flex-direction:column; height:100%; font-size:12px; color:#222; }
.dg-menu { background:#eef2f8; border-bottom:1px solid #c8d0dc; padding:2px 6px; display:flex; gap:2px; flex-shrink:0; }
.dg-menu span { padding:4px 12px; cursor:pointer; border-radius:3px; }
.dg-menu span:hover { background:#cfe0f5; }
.dg-toolbar { background:#dde5ef; border-bottom:1px solid #b8c4d4; padding:4px 8px; display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; }
.dg-btn { padding:5px 12px; background:linear-gradient(#fdfdfd,#e8ecf2); border:1px solid #9aa8ba; border-radius:3px; cursor:pointer; font-size:12px; }
.dg-btn:hover { background:#dbe7f7; }
.dg-btn:disabled { color:#999; cursor:not-allowed; }
.dg-main { flex:1; display:flex; min-height:0; }
.dg-left { width:180px; border-right:1px solid #c0c8d4; background:#fff; padding:6px; overflow:auto; flex-shrink:0; }
.dg-tree { font-size:12px; line-height:1.9; }
.dg-tree .disknode { font-weight:bold; }
.dg-right { flex:1; padding:10px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.dg-diskbar { background:#fff; border:1px solid #b8c0cc; padding:8px; }
.dg-diskbar h4 { font-size:12px; margin-bottom:6px; color:#333; }
.partbar { display:flex; height:44px; border:1px solid #888; overflow:hidden; font-size:11px; }
.pseg { display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; cursor:pointer; border-right:1px solid rgba(255,255,255,.4); overflow:hidden; transition:filter .15s; }
.pseg:hover { filter:brightness(1.15); }
.pseg .pl { font-weight:bold; } .pseg .pc { font-size:10px; opacity:.9; }
.pseg.free { background:repeating-linear-gradient(45deg,#ccc,#ccc 4px,#e8e8e8 4px,#e8e8e8 8px); color:#555; }
.psel { outline:2px solid #ff9000; outline-offset:-2px; z-index:2; }
.dg-table { width:100%; border-collapse:collapse; background:#fff; font-size:11.5px; }
.dg-table th { background:#3266b0; color:#fff; padding:5px 6px; font-weight:normal; border:1px solid #27538f; }
.dg-table td { border:1px solid #c8d0da; padding:4px 6px; text-align:center; background:#fff; }
.dg-table tr.sel td { background:#cfe3ff; }
.dg-status { background:#e2e8f0; border-top:1px solid #b8c4d4; padding:4px 10px; font-size:11px; color:#444; flex-shrink:0; display:flex; gap:20px; }
/* ---------- 对话框 ---------- */
.dlg-mask { position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:900; display:flex; align-items:center; justify-content:center; }
.dlg-mask.on-body { position:fixed; z-index:99998; }
.dlg { background:#f0f0f0; border:1px solid #666; box-shadow:0 12px 50px rgba(0,0,0,.7); min-width:460px; max-width:640px; border-radius:5px; }
.dlg .dt { background:linear-gradient(#3266b0,#27538f); color:#fff; padding:7px 12px; font-size:13px; }
.dlg .db { padding:16px 20px; font-size:13px; color:#222; }
.dlg .df { padding:10px 20px 16px; text-align:right; }
.btn { padding:6px 22px; margin-left:8px; background:linear-gradient(#fdfdfd,#e4e8ee); border:1px solid #9aa8ba; border-radius:3px; cursor:pointer; font-size:12px; }
.btn.primary { background:linear-gradient(#4a86d8,#3266b0); color:#fff; border-color:#27538f; }
.btn:hover { filter:brightness(1.08); }
.quickrow { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.quickrow label { width:120px; text-align:right; font-size:12.5px; }
.quickrow select,.quickrow input { padding:4px 6px; border:1px solid #9aa8ba; border-radius:3px; font-size:12.5px; }
.ptsize { display:flex; gap:8px; align-items:center; margin:6px 0; }
.ptsize input { width:90px; padding:4px 6px; border:1px solid #9aa8ba; border-radius:3px; text-align:right; }
.ptsize .u { font-size:12px; color:#555; }
.ptsize .bar { flex:1; height:16px; background:#e8e8e8; border:1px solid #aaa; position:relative; }
.ptsize .bar .fill { position:absolute; left:0; top:0; bottom:0; background:#3266b0; }
.chk { display:flex; align-items:center; gap:6px; margin:8px 0; font-size:12.5px; }
.chk input { width:15px; height:15px; }
.hint { font-size:11.5px; color:#777; margin-top:8px; }
.warn { color:#c0392b; font-size:12px; margin-top:6px; }
/* ---------- 考试面板 ---------- */
.exam { padding:0; display:flex; height:100%; }
.exam-side { width:270px; background:#1c2b40; color:#dfe8f5; padding:14px; flex-shrink:0; overflow:auto; }
.exam-side h3 { font-size:15px; margin-bottom:10px; color:#8fc1ff; }
.exam-q { background:#263b5c; border:1px solid #3c5a86; border-radius:5px; padding:10px 12px; margin-bottom:10px; font-size:12.5px; line-height:1.7; cursor:pointer; }
.exam-q.active { border-color:#4a9eff; background:#2f4a73; }
.exam-q .tag { display:inline-block; font-size:10px; padding:1px 7px; border-radius:8px; margin-left:6px; }
.tag.todo { background:#8a6d1a; color:#ffe9a8; } .tag.done { background:#2c7a3f; color:#c9f7d4; } .tag.fail { background:#8a2c2c; color:#ffd4d4; }
.exam-main { flex:1; display:flex; flex-direction:column; min-width:0; }
.exam-head { background:#fff; border-bottom:1px solid #ccd; padding:12px 18px; font-size:14px; font-weight:bold; }
.exam-body { flex:1; overflow:auto; padding:16px 18px; font-size:13px; line-height:1.9; }
.exam-body .req { background:#eef5ff; border-left:3px solid #3266b0; padding:10px 14px; margin:8px 0; font-size:12.5px; }
.exam-score { background:#263b5c; color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px; font-size:13px; }
.score-big { font-size:26px; font-weight:bold; color:#7dff9a; }
.score-big.bad { color:#ff8f8f; }
/* ---------- 日志 ---------- */
#toast { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:9999; pointer-events:none; }
.toastmsg { background:rgba(20,30,45,.92); color:#fff; padding:9px 22px; border-radius:20px; font-size:13px; margin-bottom:8px; border:1px solid rgba(255,255,255,.2); box-shadow:0 4px 18px rgba(0,0,0,.5); animation:tin .25s; }
.toastmsg.ok { border-color:#5aff8a; } .toastmsg.err { border-color:#ff6a6a; }
@keyframes tin { from { opacity:0; transform:translateY(-12px);} to { opacity:1; } }
/* 装系统窗口 */
.setup { font-size:12.5px; color:#222; padding:10px; }
.setup .langsel { display:flex; gap:10px; margin:10px 0 20px; }
.setup select { padding:5px 8px; border:1px solid #999; border-radius:3px; }
.setup h2 { font-size:16px; margin-bottom:6px; }
.bigbtn { padding:8px 26px; font-size:13px; background:linear-gradient(#4a86d8,#3266b0); color:#fff; border:1px solid #27538f; border-radius:4px; cursor:pointer; }
.progress { height:18px; background:#dfe6ee; border:1px solid #99a; border-radius:9px; overflow:hidden; margin:12px 0; }
.progress .pf { height:100%; width:0%; background:linear-gradient(90deg,#3fa34d,#5bd97a); transition:width .3s; }
.dlg .db table.ptlist { width:100%; border-collapse:collapse; font-size:12px; margin:10px 0; }
.dlg .db table.ptlist td, .dlg .db table.ptlist th { border:1px solid #b8c0cc; padding:5px 8px; text-align:center; }
.dlg .db table.ptlist th { background:#e2e8f0; }
/* 右键菜单（桌面 / DiskGenius 分区列表共用） */
.ctx-menu {
  position:fixed; z-index:99999; min-width:186px; padding:4px 0;
  background:#f4f6f9; border:1px solid #9aa4b2; border-radius:4px;
  box-shadow:2px 4px 14px rgba(0,0,0,.45); font-size:12.5px; color:#1e2733;
  user-select:none;
}
.ctx-menu .ctx-item { display:flex; align-items:center; gap:9px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
.ctx-menu .ctx-item:hover { background:#2f6fd0; color:#fff; }
.ctx-menu .ctx-item.dis { color:#a3aab4; cursor:default; }
.ctx-menu .ctx-item.dis:hover { background:transparent; color:#a3aab4; }
.ctx-menu .ctx-item .ci { width:16px; text-align:center; font-size:13px; }
.ctx-menu .ctx-item .cl { flex:1; }
.ctx-menu .ctx-item .ck { color:#8b95a2; font-size:11px; margin-left:14px; }
.ctx-menu .ctx-item:hover .ck { color:#d6e4f7; }
.ctx-menu .ctx-sep { height:1px; margin:4px 2px; background:#c9d1da; }

/* ============================================================
   仿真增强：Windows 10 PE 桌面 / 任务栏 / 窗口边框
   ============================================================ */
#screen { background:
  radial-gradient(1200px 700px at 50% 120%, #1b4b7a 0%, transparent 60%),
  linear-gradient(160deg,#0a1a2f 0%,#123055 45%,#1d4e89 100%); }
.dicon.sel { background:rgba(90,160,255,.30); outline:1px solid rgba(140,190,255,.75); border-radius:4px; }
.dicon .ico { filter:drop-shadow(0 3px 5px rgba(0,0,0,.55)); }
#taskbar { height:44px; background:rgba(16,24,36,.95); }
#startbtn { width:48px; height:34px; font-size:20px; }
#tbsearch {
  display:flex; align-items:center; gap:6px; margin-left:6px; padding:3px 12px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16);
  border-radius:3px; color:#cfd8e3; font-size:12px; cursor:text;
}
.tray { display:flex; align-items:center; gap:10px; margin-left:auto; color:#dfe8f5; font-size:14px; }
.tray .tray-ico { cursor:pointer; opacity:.9; }
.tray .tray-ico:hover { opacity:1; }
#clock { margin-left:10px; }
#showdesk { width:9px; height:34px; margin-left:8px; border-left:1px solid rgba(255,255,255,.3); cursor:pointer; }
/* 窗口：改为 Windows 10 风格浅色标题栏 */
.win { border:1px solid #cdd3da; border-radius:6px 6px 0 0;
  box-shadow:0 14px 40px rgba(0,0,0,.5); }
.titlebar { height:32px; background:linear-gradient(#fbfbfb,#f0f1f3); color:#1f1f1f;
  padding:0 0 0 12px; border-bottom:1px solid #e2e5e9; font-size:12.5px; }
.titlebar .t::before { content:"◈ "; color:#2f6fd0; }
.wbtn { width:46px; height:32px; color:#333; border-radius:0; font-size:12px; }
.wbtn:hover { background:#e6e9ed; }
.wbtn.close:hover { background:#e81123; color:#fff; }
#startmenu { background:#1c2432; border:1px solid #3a4658; }
.smitem:hover { background:#2f6fd0; }

/* ---------------- 图吧工具箱 ---------------- */
.tuba { display:flex; flex-direction:column; height:100%; background:#eef1f6; font-size:12.5px; color:#22303f; }
.tuba-top { display:flex; align-items:center; gap:12px; padding:8px 14px; background:linear-gradient(#28394f,#1f2d40);
  color:#dbe6f2; flex-shrink:0; }
.tuba-logo { width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,#3f8ae0,#245a9e);
  display:flex; align-items:center; justify-content:center; font-size:19px; }
.tuba-brand { font-size:14px; font-weight:700; line-height:1.15; }
.tuba-brand small { display:block; font-weight:400; font-size:10.5px; color:#8fb0d0; letter-spacing:.4px; }
.tuba-search { flex:1; }
.tuba-search input { width:100%; max-width:320px; padding:5px 12px; border-radius:16px; border:1px solid #4a5f79;
  background:#152233; color:#dbe6f2; font-size:12px; outline:none; }
.tuba-search input:focus { border-color:#3f8ae0; }
.tuba-badge { font-size:11px; color:#9fc0e0; background:rgba(255,255,255,.08); padding:3px 10px; border-radius:10px; }
.tuba-main { flex:1; display:flex; min-height:0; }
.tuba-side { width:196px; background:#233449; color:#cfdcec; padding:8px 0; overflow:auto; flex-shrink:0; }
.tubacat { padding:8px 16px; cursor:pointer; font-size:12.5px; border-left:3px solid transparent; }
.tubacat:hover { background:#2b4058; }
.tubacat.on { background:#2f4a6e; border-left-color:#5fa8ff; color:#fff; }
.tuba-sidefoot { padding:16px; font-size:10.5px; color:#7a8ba0; line-height:1.6; }
.tuba-right { flex:1; padding:14px 16px; overflow:auto; min-width:0; }
.tuba-cattitle { font-size:15px; font-weight:700; margin-bottom:12px; color:#1c2b3d; }
.tuba-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:12px; }
.tubatool { text-align:center; padding:14px 6px 10px; background:#fff; border:1px solid #dfe5ec; border-radius:8px;
  cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s; }
.tubatool:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(40,80,140,.18); border-color:#9dc0ea; }
.tubatool .tb-ico { font-size:30px; line-height:1; }
.tubatool .tb-name { font-size:11.5px; margin-top:7px; color:#24313f; }
.tubatool .tb-ver { font-size:10px; color:#8fa0b3; margin-top:2px; }
.tuba-status { display:flex; padding:5px 14px; background:#dfe5ee; border-top:1px solid #c4cdd9;
  font-size:11px; color:#5a6a7d; flex-shrink:0; }

/* ---------------- AIDA64 ---------------- */
.aida { display:flex; flex-direction:column; height:100%; background:#eef1f6; font-size:12.5px; color:#22303f; }
.aida-menu { display:flex; gap:2px; padding:3px 8px; background:#dfe5ee; border-bottom:1px solid #c4cdd9; }
.aida-menu span { padding:3px 10px; border-radius:3px; cursor:default; color:#33465c; }
.aida-menu span:hover { background:#c9d8ee; }
.aida-toolbar { display:flex; align-items:center; gap:6px; padding:6px 10px; background:#e7ebf1; border-bottom:1px solid #c4cdd9; }
.ai-tb { padding:4px 12px; border:1px solid #b9c4d2; border-radius:5px; background:linear-gradient(#fff,#eaeef4);
  cursor:pointer; font-size:12px; }
.ai-tb:hover { border-color:#6ba0e0; }
.ai-tb.on { background:linear-gradient(#4a86d8,#3266b0); color:#fff; border-color:#27538f; }
.ai-spacer { flex:1; }
.ai-ver { font-size:11px; color:#7b8a9d; }
.aida-body { flex:1; display:flex; min-height:0; }
.aida-tree { width:190px; background:#fff; border-right:1px solid #c4cdd9; overflow:auto; padding:6px 0; flex-shrink:0; }
.ai-grp { padding:5px 12px; font-weight:700; color:#2f6fd0; font-size:11.5px; }
.ai-node { padding:4px 12px 4px 24px; cursor:pointer; color:#33465c; }
.ai-node:hover { background:#eef4fd; }
.ai-node.on { background:#dce9fb; color:#1b5aa8; font-weight:600; }
.aida-page { flex:1; overflow:auto; padding:14px 18px; min-width:0; }
.ai-h { font-size:14px; font-weight:700; color:#1c3d66; margin-bottom:10px; }
.ai-table { width:100%; border-collapse:collapse; background:#fff; font-size:12.5px; }
.ai-table td { border:1px solid #d3dae3; padding:6px 10px; }
.ai-k { width:38%; background:#f4f7fb; color:#4a5b70; }
.ai-v { color:#1c2b3d; }
.ai-note { margin-top:12px; font-size:11.5px; color:#5a6a7d; background:#f5f8fc; border-left:3px solid #6ba0e0;
  padding:8px 10px; line-height:1.7; }
.aida-foot { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:9px 14px; background:#e7ebf1;
  border-top:1px solid #c4cdd9; flex-shrink:0; }
.aida-foot select, .aida-foot input { padding:4px 6px; border:1px solid #9aa8ba; border-radius:3px; font-size:12px; }
.aida-foot input { width:76px; }

/* ---------------- MemTest86 ---------------- */
.mt { display:flex; flex-direction:column; height:100%; background:#0b0f14; color:#c9d6e4; font-size:12.5px; }
.mt-head { display:flex; justify-content:space-between; padding:6px 12px; background:#12233b; color:#8fc1ff;
  border-bottom:1px solid #26456b; }
.mt-right { color:#7f9cb5; font-size:11px; }
.mt-console { flex:1; margin:0; padding:12px 14px; overflow:auto; white-space:pre-wrap;
  font:12.5px/1.7 Consolas,"Courier New",monospace; color:#a9d3ff; background:#0a1420; }
.mt-stats { display:flex; gap:10px; padding:8px 12px; background:#0f1c2c; border-top:1px solid #22344c; }
.mt-stats > div { flex:1; background:#132539; border:1px solid #26456b; border-radius:5px; padding:6px 10px; }
.mt-stats label { display:block; font-size:10.5px; color:#7f9cb5; }
.mt-stats b { font-size:20px; font-family:Consolas,monospace; color:#9ef2a5; }
.mt-stats b.bad { color:#ff8f8f; }
.mt-progress { height:14px; background:#0f1c2c; border-top:1px solid #22344c; overflow:hidden; }
.mt-pf { height:100%; width:0; background:linear-gradient(90deg,#3fa34d,#5bd97a); transition:width .3s; }
.mt-foot { display:flex; align-items:center; gap:8px; padding:9px 12px; background:#0f1c2c; border-top:1px solid #22344c; }
.mt-foot select { padding:4px 6px; background:#132539; color:#c9d6e4; border:1px solid #26456b; border-radius:3px; }

/* ---------------- 键盘测试 ---------------- */
.kbd { display:flex; flex-direction:column; height:100%; background:#eef1f6; font-size:12.5px; color:#22303f; }
.kbd-info { display:flex; gap:18px; align-items:center; flex-wrap:wrap; padding:10px 14px;
  background:#20293a; color:#dbe6f2; flex-shrink:0; }
.kbd-info label { display:block; font-size:10.5px; color:#8fb0d0; margin-bottom:2px; }
.kbd-info b { font-family:Consolas,monospace; font-size:14px; }
.kbd-need label { color:#8fb0d0; }
.kn { display:inline-block; padding:1px 9px; margin-right:5px; border-radius:9px; background:#33445c;

<body>
<div id="screen">
  <div id="desktop"><div class="dicon" style="left: 24px; top: 24px;"><div class="ico">💽</div><div class="lbl">DiskGenius</div></div><div class="dicon" style="left: 24px; top: 130px;"><div class="ico">💿</div><div class="lbl">Windows 安装器</div></div><div class="dicon" style="left: 24px; top: 236px;"><div class="ico">📝</div><div class="lbl">考试系统</div></div><div class="dicon" style="left: 24px; top: 342px;"><div class="ico">🧰</div><div class="lbl">图吧工具箱</div></div><div class="dicon" style="left: 24px; top: 448px;"><div class="ico">🖥️</div><div class="lbl">此电脑</div></div></div>

   <div class="smitem" data-a="setup"><span class="si">💿</span>Windows 安装器</div>

<script>
/* ================= 题库 ================= */
const QUESTIONS = [
  {
    id:1, title:"快速分区 · 基础题", points:60,
    desc:"使用 DiskGenius 的【快速分区】功能，将硬盘重新分区：",
    req:["分成 <b>3 个分区</b>（1个主分区 + 2个逻辑分区均可，快速分区默认即可）",
         "C 盘（第一个分区）大小设为 <b>100 GB</b>",
         "勾选 <b>4K 对齐</b>，对齐分区到 4096 扇区",
         "分区表类型保持 <b>MBR（GUID 也可，若题目另有要求以此为准）</b>",
         "点击【确定】并在确认对话框中点击【是】完成操作"],
    check(state){
      const errs=[];
      const q=state.lastQuick;
      if(!q) return {score:0,errors:["尚未执行快速分区操作"]};
      if(q.count!==3) errs.push("分区数量应为3，实际为"+q.count);
      if(Math.abs(q.firstGB-100)>1) errs.push("第一分区(C盘)大小应为100GB，实际为"+q.firstGB+"GB");
      if(!q.align4k) errs.push("未勾选 4K 对齐");
      if(q.alignSectors!==4096) errs.push("4K对齐扇区数应为4096，实际为"+q.alignSectors);
      if(!q.confirmed) errs.push("未在确认对话框中点击【是】");
      const ratio=Math.max(0,1-errs.length/5);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:2, title:"快速分区 · 进阶题", points:60,
    desc:"按要求完成快速分区（GUID/UEFI 装机规范）：",
    req:["分区表类型选择 <b>GUID（GPT）</b>",
         "分区数量 <b>4 个</b>",
         "勾选【创建新ESP分区】和【创建MSR分区】",
         "第一分区 80GB，第二分区 200GB，其余默认",
         "勾选 4K 对齐（默认20480扇区即可），确认执行"],
    check(state){
      const errs=[]; const q=state.lastQuick;
      if(!q) return {score:0,errors:["尚未执行快速分区操作"]};
      if(q.table!=="GUID") errs.push("分区表类型应选择 GUID");
      if(q.count!==4) errs.push("分区数量应为4，实际为"+q.count);
      if(!q.esp) errs.push("未勾选【创建新ESP分区】");
      if(!q.msr) errs.push("未勾选【创建MSR分区】");
      if(Math.abs(q.firstGB-80)>1) errs.push("第一分区应为80GB，实际"+q.firstGB+"GB");
      if(Math.abs(q.secondGB-200)>1) errs.push("第二分区应为200GB，实际"+q.secondGB+"GB");
      if(!q.align4k) errs.push("未勾选 4K 对齐");
      if(!q.confirmed) errs.push("未确认执行");
      const ratio=Math.max(0,1-errs.length/7);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:3, title:"删除分区操作", points:40,
    desc:"对现有分区进行删除练习：",
    req:["在分区列表中选中 <b>E盘</b>",
         "右键或点击【删除分区】按钮",
         "在确认对话框中点击【是】"],
    check(state){
      const errs=[]; const d=state.lastDelete;
      if(!d) return {score:0,errors:["尚未执行删除分区操作"]};
      if(d.label!=="E盘") errs.push("删除的应是E盘，实际删除了"+d.label);
      if(!d.confirmed) errs.push("未在确认对话框中点击【是】");
      const ratio=Math.max(0,1-errs.length/2);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:4, title:"模拟安装系统", points:40,
    desc:"使用【Windows 安装器】模拟安装系统流程：",
    req:["打开桌面的【Windows 安装器】",
         "选择包含Windows的安装映像",
         "引导分区选择 <b>C</b>，安装分区选择 <b>C</b>",
         "点击【安装系统】并等待进度完成"],
    check(state){
      const errs=[]; const s=state.lastInstall;
      if(!s) return {score:0,errors:["尚未执行安装系统操作"]};
      if(s.boot!=="C") errs.push("引导分区应选择C");
      if(s.target!=="C") errs.push("安装分区应选择C");
      if(!s.finished) errs.push("安装进度未完成");
      const ratio=Math.max(0,1-errs.length/3);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:5, title:"硬盘健康检查（CrystalDiskInfo）", points:30,
    desc:"使用图吧工具箱中的 CrystalDiskInfo 检查硬盘健康状况：",
    req:["打开图吧工具箱 → 硬盘检测 → <b>CrystalDiskInfo</b>",
         "等待 SMART 信息加载完成（自动）",
         "判断当前硬盘健康状态并点击下方【提交健康结论】，选择 <b>良好</b>（模拟盘健康状态为良好）",
         "记录 C5 (待映射扇区数) 的原始值"],
    check(state){
      const errs=[]; const c=state.lastCdi;
      if(!c) return {score:0,errors:["尚未在 CrystalDiskInfo 中提交健康结论"]};
      if(c.verdict!=="良好") errs.push("健康结论判断错误，模拟盘状态为良好，你选择了"+c.verdict);
      if(c.c5!=="0") errs.push("C5 原始值应记录为 0，你填写的是"+c.c5);
      const ratio=Math.max(0,1-errs.length/2);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:6, title:"磁盘测速（CrystalDiskMark）", points:30,
    desc:"使用 CrystalDiskMark 对 C 盘进行基准测速：",
    req:["打开图吧工具箱 → 硬盘检测 → <b>CrystalDiskMark</b>",
         "测试分区选择 <b>C:</b>",
         "测试次数选 <b>5</b>，测试大小选 <b>1GiB</b>",
         "点击 <b>All</b> 按钮运行完整测试并等待完成",
         "完成后点击【提交成绩】"],
    check(state){
      const errs=[]; const m=state.lastCdm;
      if(!m) return {score:0,errors:["尚未提交 CrystalDiskMark 测速成绩"]};
      if(m.drive!=="C:") errs.push("测速分区应选择 C:，实际为 "+m.drive);
      if(m.count!==5) errs.push("测试次数应为5，实际为"+m.count);
      if(m.size!=="1GiB") errs.push("测试大小应为1GiB，实际为"+m.size);
      if(!m.allRun) errs.push("未点击 All 运行完整测试");
      if(!m.finished) errs.push("测试未完成就提交了成绩");
      const ratio=Math.max(0,1-errs.length/5);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:7, title:"显示器坏点检测", points:30,
    desc:"使用图吧工具箱的屏幕检测工具检测显示器：",
    req:["打开图吧工具箱 → 屏幕检测 → <b>屏幕检测(坏点/纯色)</b>",
         "依次切换 <b>红、绿、蓝、白、黑</b> 五种纯色（至少各查看一次）",
         "退出纯色模式，得出结论：模拟显示器为 <b>无坏点</b>",
         "点击【提交检测结论】"],
    check(state){
      const errs=[]; const s=state.lastScreenTest;
      if(!s) return {score:0,errors:["尚未提交屏幕检测结论"]};
      const need=["red","green","blue","white","black"];
      const miss=need.filter(c=>!s.colors.includes(c));
      if(miss.length) errs.push("还有纯色未查看: "+miss.map(c=>({red:"红",green:"绿",blue:"蓝",white:"白",black:"黑"}[c])).join("、"));
      if(s.verdict!=="无坏点") errs.push("检测结论应为【无坏点】，你选择了【"+s.verdict+"】");
      const ratio=Math.max(0,1-errs.length/(need.length+1));
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:8, title:"CPU 烤机测试", points:30,
    desc:"使用烤机工具对 CPU 进行压力测试：",
    req:["打开图吧工具箱 → 烤机测试 → <b>CPU烤机(压力测试)</b>",
         "选择测试模式 <b>极端模式(Extreme)</b>",
         "线程数保持 <b>全部线程</b>",
         "点击【开始烤机】并持续运行 <b>至少60秒</b>（模拟时间）",
         "点击【停止烤机】后提交烤机报告"],
    check(state){
      const errs=[]; const b=state.lastBurn;
      if(!b) return {score:0,errors:["尚未提交烤机报告"]};
      if(b.mode!=="Extreme") errs.push("测试模式应选择 Extreme，实际为 "+b.mode);
      if(b.threads!=="all") errs.push("线程应选择全部线程");
      if(b.durationSec<60) errs.push("烤机时长应至少60秒，实际"+(b.durationSec||0)+"秒");
      if(!b.stopped) errs.push("未正常停止烤机并提交报告");
      const ratio=Math.max(0,1-errs.length/4);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:9, title:"硬件信息检测（AIDA64）", points:30,
    desc:"使用图吧工具箱中的 AIDA64 读取本机硬件信息：",
    req:["打开图吧工具箱 → 硬件检测 → <b>AIDA64</b>",
         "在左侧选择【计算机 → 汇总】，查看 <b>主板型号</b>与<b>内存容量</b>",
         "切换到【传感器】页，读取 <b>CPU 温度</b>",
         "点击【提交检测报告】，按界面读数如实填写"],
    check(state){
      const errs=[]; const a=state.lastAida;
      if(!a) return {score:0,errors:["尚未提交 AIDA64 检测报告"]};
      if(a.board!=="B660M-PLUS") errs.push("主板型号填写错误，应为 B660M-PLUS，你填的是 "+(a.board||"空"));
      if(String(a.memGB)!=="16") errs.push("内存容量应为 16 GB，你填的是 "+(a.memGB||"空")+" GB");
      const t=parseFloat(a.cpuTemp);
      if(!(t>=30&&t<=85)) errs.push("CPU 温度应填传感器实测值（30~85℃），你填的是 "+(a.cpuTemp||"空"));
      const ratio=Math.max(0,1-errs.length/3);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:10, title:"内存完整性检测（MemTest）", points:30,
    desc:"使用内存检测工具对内存条做完整性压力检测：",
    req:["打开图吧工具箱 → 烤机测试 → <b>内存检测(MemTest)</b>",
         "选择测试容量后点击【开始检测】",
         "等待 <b>完整跑满至少 1 轮</b>（Pass ≥ 1）",
         "确认错误数（Errors）为 <b>0</b> 后点击【停止】并提交报告"],
    check(state){
      const errs=[]; const m=state.lastMemtest;
      if(!m) return {score:0,errors:["尚未提交内存检测报告"]};
      if(!m.done) errs.push("检测未正常停止就提交了报告");
      if((m.passes||0)<1) errs.push("应至少完整跑满 1 轮，实际 "+(m.passes||0)+" 轮");
      if((m.errors||0)!==0) errs.push("错误数应为 0，实际 "+(m.errors||0));
      const ratio=Math.max(0,1-errs.length/3);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:11, title:"键盘按键响应检测", points:30,
    desc:"使用键盘测试工具检测键盘按键是否全部正常：",
    req:["打开图吧工具箱 → 外设检测 → <b>键盘测试</b>",
         "依次真实按下 <b>A、S、D、F</b> 四个按键",
         "再按下一次 <b>空格键</b>",
         "确认五个键在界面中均显示为已响应后，点击【提交报告】"],
    check(state){
      const errs=[]; const k=state.lastKbd;
      if(!k) return {score:0,errors:["尚未提交键盘检测报告"]};
      const keys=(k.keys||[]).map(x=>String(x).toLowerCase());
      const need=[["a","A"],["s","S"],["d","D"],["f","F"],["space","空格"]];
      const miss=need.filter(n=>!keys.includes(n[0])).map(n=>n[1]);
      if(miss.length) errs.push("以下按键未测到响应：" + miss.join("、"));
      const ratio=Math.max(0,1-errs.length/need.length);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  },
  {
    id:12, title:"鼠标按键与滚轮检测", points:30,
    desc:"使用鼠标测试工具检测鼠标各按键与滚轮：",
    req:["打开图吧工具箱 → 外设检测 → <b>鼠标测试</b>",
         "分别点击一次 <b>左键</b>与<b>右键</b>",
         "滚动 <b>滚轮</b>一次（上或下）",
         "在测试区 <b>双击左键</b>一次，四项均显示响应后提交报告"],
    check(state){
      const errs=[]; const m=state.lastMouse;
      if(!m) return {score:0,errors:["尚未提交鼠标检测报告"]};
      if(!m.left) errs.push("未检测到左键点击");
      if(!m.right) errs.push("未检测到右键点击");
      if(!m.wheel) errs.push("未检测到滚轮滚动");
      if(!m.dbl) errs.push("未检测到双击");
      const ratio=Math.max(0,1-errs.length/4);
      return {score:Math.round(this.points*ratio),errors:errs};
    }
  }
];

/* ================= 全局状态 ================= */
function defaultDisks(){ return [{id:0,name:"HD0: NVMe SSD 512GB",sizeGB:476.94,parts:[
    {label:"C盘",type:"主分区",fs:"NTFS",startGB:0,sizeGB:150,used:68},
    {label:"D盘",type:"逻辑分区",fs:"NTFS",startGB:150,sizeGB:180,used:45},
    {label:"E盘",type:"逻辑分区",fs:"NTFS",startGB:330,sizeGB:146.94,used:30},
  ]}]; }

/* 用 let 而非 const：考试模式下会被换成 Proxy 包装的可观测对象。
   注意 cdmDoneAll / scrColors / burnSimSec 必须放进 state，
   否则 resetAll 清不掉（原实现里 cdmDoneAll 是模块级全局变量，
   跑过一次测速后永不重置 → 后面免做即得满分）。 */
let state = {
  disks: defaultDisks(),
  lastQuick:null, lastDelete:null, lastInstall:null,
  lastCdi:null, lastCdm:null, lastMemTest:null, lastScreenTest:null, lastBurn:null,
  lastAida:null, lastMemtest:null, lastKbd:null, lastMouse:null,
  examOpen:null, results:{},
  cdmDoneAll:false,     // 是否完整跑过一次 All 测速
  scrColors:[],         // 坏点检测已查看过的颜色
  burnSimSec:0,         // 烤机累计秒数
  bootPicked:null,      // 引导时选择的设备
  peReady:false         // PE 桌面是否就绪
};
const TOTAL_POINTS = QUESTIONS.reduce((s,q)=>s+q.points,0);

/**
 * 考试模式**禁用** localStorage。
 * 原实现把成绩存在浏览器本地，且 key 是全局常量 "pe_exam_state"：
 *   · 同一台机器考多个学生会互相覆盖串号
 *   · 学生 F12 改一下 localStorage 就能拿满分
 *   · 换台机器/清缓存成绩就蒸发
 * 正式考试一律走"服务端事件流"，本地只保留内存态。
 * 练习模式仍用 localStorage，方便课堂演示。
 */
function isExamMode(){ return !!(window.SimExam && SimExam.isExam()); }

function saveState(){
  if(isExamMode()) return;
  try{ localStorage.setItem("pe_exam_state", JSON.stringify({
    disks:state.disks, lastQuick:state.lastQuick, lastDelete:state.lastDelete,
    lastInstall:state.lastInstall, lastCdi:state.lastCdi, lastCdm:state.lastCdm,
    lastScreenTest:state.lastScreenTest, lastBurn:state.lastBurn, results:state.results,
    lastAida:state.lastAida, lastMemtest:state.lastMemtest, lastKbd:state.lastKbd, lastMouse:state.lastMouse,
    cdmDoneAll:state.cdmDoneAll, scrColors:state.scrColors, burnSimSec:state.burnSimSec
  })); }catch(e){}
}
function loadState(){
  if(isExamMode()) return;
  try{ const s=JSON.parse(localStorage.getItem("pe_exam_state")||"null"); if(s){ Object.assign(state,s); if(!s.disks) state.disks=defaultDisks(); } }catch(e){}
}
function resetAll(){
  state.lastQuick=null; state.lastDelete=null; state.lastInstall=null;
  state.lastCdi=null; state.lastCdm=null; state.lastScreenTest=null; state.lastBurn=null;
  state.lastAida=null; state.lastMemtest=null; state.lastKbd=null; state.lastMouse=null;
  state.results={};
  state.cdmDoneAll=false;      // ← 原实现漏了这一行，导致"免做即满分"
  state.scrColors=[];
  state.burnSimSec=0;
  state.disks=defaultDisks();
  if(typeof kbdResetUI==="function") kbdResetUI();
  if(typeof mouseResetUI==="function") mouseResetUI();
  if(typeof memtestResetUI==="function") memtestResetUI();
  if(isExamMode() && window.SimExam) SimExam.emit('step','env.reset',{});
  saveState();
}

/* ================= 右键菜单 =================
   真实 PE 里维护人员用得最多的就是右键：右键分区 → 删除分区 / 格式化。
   以前题面写着"右键"，界面却只有工具栏按钮，学生找不到，这里补齐。
   菜单里的"删除分区"走的是和工具栏按钮同一个 dgDelete()，判分不受影响。
   ============================================================ */
let ctxEl = null;
function closeCtx(){
  if(ctxEl){ ctxEl.remove(); ctxEl = null; }
  document.removeEventListener("mousedown", onDocDown, true);
  document.removeEventListener("contextmenu", onDocDown, true);
}
/* 注意：不能用 {once:true} 直接挂 mousedown —— 菜单项自己的 mousedown
   会先关掉菜单，click 就永远触发不了。这里只在"点到菜单外面"时才关。 */
function onDocDown(e){
  if(ctxEl && ctxEl.contains(e.target)) return;
  closeCtx();
}
function showCtxMenu(x, y, items){
  closeCtx();
  const el = document.createElement("div");
  el.className = "ctx-menu";
  el.innerHTML = items.map((it, i) => it.sep
    ? '<div class="ctx-sep"></div>'
    : '<div class="ctx-item' + (it.disabled ? ' dis' : '') + '" data-i="' + i + '">' +
        '<span class="ci">' + (it.ico || "") + '</span>' +
        '<span class="cl">' + it.label + '</span>' +
        (it.key ? '<span class="ck">' + it.key + '</span>' : '') +
      '</div>').join("");
  document.body.appendChild(el);
  // 靠近屏幕边缘时向内收，避免菜单被切掉
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(2, Math.min(x, innerWidth  - w - 6)) + "px";
  el.style.top  = Math.max(2, Math.min(y, innerHeight - h - 6)) + "px";
  el.querySelectorAll(".ctx-item").forEach(n => {
    n.onclick = e => {
      e.stopPropagation();
      const it = items[+n.dataset.i];
      closeCtx();
      if(it && !it.disabled && it.run) it.run();
    };
  });
  ctxEl = el;
  // 延后一拍再挂关闭：否则本次 contextmenu 事件会立刻把自己关掉
  setTimeout(() => {
    document.addEventListener("mousedown", onDocDown, true);
    document.addEventListener("contextmenu", onDocDown, true);
  }, 0);
}

/* ================= 窗口管理 ================= */
let zTop=100, winSeq=0, wins={};
function createWin(id,title,w,h,bodyHTML){
  if(wins[id]){ focusWin(id); return wins[id]; }
  const el=document.createElement("div"); el.className="win";
  el.style.width=w+"px"; el.style.height=h+"px";
  el.style.left=Math.max(10,(innerWidth-w)/2+ (winSeq*24%120))+"px";
  el.style.top=Math.max(10,(innerHeight-h)/2-30 + (winSeq*20%80))+"px";
  winSeq++;
  el.innerHTML=`<div class="titlebar"><span class="t">${title}</span>
    <span class="wbtn min">—</span><span class="wbtn max">▢</span><span class="wbtn close">✕</span></div>
    <div class="wbody">${bodyHTML}</div>`;
  $("#desktop").appendChild(el);
  const rec={el,id}; wins[id]=rec; zTop++; el.style.zIndex=zTop;
  // drag
  const tb=el.querySelector(".titlebar");
  tb.addEventListener("mousedown",ev=>{
    if(ev.target.classList.contains("wbtn"))return;
    const sx=ev.clientX-el.offsetLeft, sy=ev.clientY-el.offsetTop;
    const mv=e2=>{ el.style.left=(e2.clientX-sx)+"px"; el.style.top=Math.max(0,e2.clientY-sy)+"px"; };
    const up=()=>{ document.removeEventListener("mousemove",mv); document.removeEventListener("mouseup",up); };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  });
  el.querySelector(".close").onclick=()=>{ el.remove(); delete wins[id]; refreshTaskbar(); };
  el.querySelector(".max").onclick=()=>{ el.classList.toggle("max"); };
  el.querySelector(".min").onclick=()=>{ el.style.display="none"; rec.min=true; refreshTaskbar(); };
  el.addEventListener("mousedown",()=>focusWin(id));
  // taskbar button
  const tb2=document.createElement("div"); tb2.className="tbtn"; tb2.textContent=title; tb2.dataset.win=id;
  tb2.onclick=()=>{ if(rec.min||el.style.display==="none"){el.style.display="flex";rec.min=false;focusWin(id);} else if(wins[id]&&el.style.zIndex==zTop){el.style.display="none";rec.min=true;} else focusWin(id); refreshTaskbar(); };
  $("#tasks").appendChild(tb2);
  refreshTaskbar();
  return rec;
}
function focusWin(id){ const r=wins[id]; if(!r)return; zTop++; r.el.style.zIndex=zTop; refreshTaskbar(); }
function refreshTaskbar(){ document.querySelectorAll(".tbtn").forEach(b=>{ const r=wins[b.dataset.win]; b.classList.toggle("active", r && !r.min); }); }
function refreshAll(){ if(wins["dg"]) renderDG(); if(wins["exam"]) renderExam(); }

function dlgBox(title,bodyHTML,onOk,okText="确定"){
  const mask=document.createElement("div"); mask.className="dlg-mask";
  mask.innerHTML=`<div class="dlg"><div class="dt">${title}</div><div class="db">${bodyHTML}</div>
   <div class="df"><button class="btn" data-a="cancel">取消</button><button class="btn primary" data-a="ok">${okText}</button></div></div>`;
  // DiskGenius 窗口开着时贴在窗口内（更像真机）；否则退回整页居中，避免对话框无处可挂
  const host=(wins["dg"]&&wins["dg"].el)||document.body;
  if(host===document.body) mask.classList.add("on-body");
  host.appendChild(mask);
  mask.querySelector('[data-a="cancel"]').onclick=()=>mask.remove();
  mask.querySelector('[data-a="ok"]').onclick=()=>{ if(onOk(mask)!==false) mask.remove(); };
  return mask;
}
function dgQuick(){
  const q = state.lastQuick||{};
  const m=dlgBox("快速分区 - DiskGenius",`
    <div class="quickrow"><label>分区表类型:</label>
      <select id="qTable"><option value="MBR"${q.table!=="GUID"?" selected":""}>MBR</option><option value="GUID"${q.table==="GUID"?" selected":""}>GUID(适用于UEFI)</option></select>
      <span style="font-size:11px;color:#777">修改后请点击【重置分区数量】</span></div>
    <div class="quickrow"><label>分区数量:</label>
      <select id="qCount">${[1,2,3,4,5,6].map(n=>`<option${(q.count||3)===n?" selected":""}>${n}</option>`).join("")}</select>
      <button class="btn" id="qReset" style="margin-left:12px">重置分区数量</button></div>
    <div class="chk"><input type="checkbox" id="qEsp"${q.esp?" checked":""}><label for="qEsp">创建新ESP分区</label>
      <input type="checkbox" id="qMsr"${q.msr?" checked":""}><label for="qMsr" style="margin-left:14px">创建MSR分区</label></div>
    <div id="qParts" style="margin:10px 0;border:1px solid #c0c8d4;background:#fff;padding:8px 10px"></div>
    <div class="chk"><input type="checkbox" id="qAlign"${q.align4k!==false?" checked":""}><label for="qAlign">对齐分区到此扇区数的整数倍 (4K对齐)</label>
      <select id="qAlignN" style="margin-left:8px"><option>1024</option><option>2048</option><option selected>4096</option><option>8192</option><option>20480</option></select></div>
    <div class="chk"><input type="checkbox" id="qRebuild" checked><label for="qRebuild">重建主引导记录(MBR)</label></div>
    <div class="warn">⚠ 警告: 快速分区将删除当前硬盘上的所有分区和数据！(模拟环境不破坏任何真实数据)</div>`,
  mask=>{
    const count=+mask.querySelector("#qCount").value;
    const table=mask.querySelector("#qTable").value;
    const sizes=[...mask.querySelectorAll(".qsz")].map(i=>+i.value||0);
    const align=mask.querySelector("#qAlign").checked;
    const alignN=+mask.querySelector("#qAlignN").value;
    const esp=mask.querySelector("#qEsp").checked, msr=mask.querySelector("#qMsr").checked;
    if(sizes[0]<=0){ toast("第一分区大小无效","err"); return false; }
    confirmDlg(`确认要立即执行快速分区吗？<br><br>硬盘 <b>${state.disks[0].name}</b> 将被重新划分为 <b>${count}</b> 个分区，原有数据将全部丢失。`,
    ()=>{
      // rebuild parts
      const total=state.disks[0].sizeGB;
      let rest=total - (esp?0.3:0) - (msr?0.016:0);
      let parts=[];
      let cur=0;
      if(esp){ parts.push({label:"ESP",type:"EFI系统分区",fs:"FAT32",startGB:0,sizeGB:0.3,used:0.05}); cur=0.3; }
      if(msr){ parts.push({label:"MSR",type:"Microsoft保留",fs:"-",startGB:cur,sizeGB:0.016,used:0}); cur+=0.016; }
      for(let i=0;i<count;i++){
        let sz = sizes[i];
        if(!sz||sz<=0) sz = (rest-cur)/(count-i);
        if(i===count-1) sz = rest-cur;
        // 容量溢出保护：原实现直接 Math.min(sz, rest-cur)，
        // 当 rest-cur 为负时会生成负容量分区，界面显示 "-120GB"
        if(rest-cur <= 0) sz = 0;
        else sz = Math.min(sz, rest-cur);
        parts.push({label:String.fromCharCode(67+i)+"盘",type:i===0?"主分区":"逻辑分区",fs:"NTFS",startGB:cur,sizeGB:Math.max(0,sz),used:0});
        cur+=sz;
      }
      state.disks[0].parts=parts; dgSel=-1;

      // 关键修复：判分依据必须来自**实际分出来的分区**，
      // 而不是用户在输入框里填的数字。
      // 原实现 firstGB:sizes[0] —— 学生把输入框改成 100 但实际只分出 20GB 也算对。
      const realMain = parts.filter(p=>p.type!=="EFI系统分区" && p.type!=="Microsoft保留");
      state.lastQuick={
        count: realMain.length,
        table: table,
        firstGB:  realMain[0] ? +realMain[0].sizeGB.toFixed(2) : 0,
        secondGB: realMain[1] ? +realMain[1].sizeGB.toFixed(2) : 0,
        align4k: align, alignSectors: alignN, esp, msr, confirmed: true
      };
      state.quicks = (state.quicks || []).concat([state.lastQuick]);   // 保留历史，供多题判定
      if(window.SimExam) SimExam.emit('step','dg.quick',state.lastQuick);
      saveState(); renderDG(); refreshAll();
      toast("快速分区完成：共 " + realMain.length + " 个分区，C 盘 "
            + (realMain[0] ? realMain[0].sizeGB.toFixed(1) : 0) + " GB","ok");
    });
  });
  // wire dynamic parts
  const buildParts=()=>{
    const table=m.querySelector("#qTable").value;
    const count=+m.querySelector("#qCount").value;
    const esp=m.querySelector("#qEsp").checked;
    const total=476.94;
    const box=m.querySelector("#qParts");
    let html="";
    let pre=0;
    if(table==="GUID"){ html+=`<div style="font-size:11px;color:#888;margin:2px 0">${esp?"ESP 300MB(自动)":""}${esp&&m.querySelector("#qMsr").checked?" + ":""}${m.querySelector("#qMsr").checked&&esp?"MSR 16MB(自动)":""}</div>`; }
    for(let i=0;i<count;i++){
      const lbl=String.fromCharCode(67+i);
      const def = q.firstGB&&i===0?q.firstGB:(q.secondGB&&i===1?q.secondGB:(i===count-1?"剩余":80+i*60));
      html+=`<div class="ptsize"><span style="width:110px;font-size:12px">${i===0?"主分区":(table==="GUID"&&esp?"主分区":"逻辑分区")} ${i+1} (${lbl}盘):</span>
        <input class="qsz" data-i="${i}" value="${def}"> <span class="u">GB</span>
        <div class="bar"><div class="fill"></div></div>
        ${i===0?'<span style="font-size:11px;color:#777">用于安装系统和存储数据</span>':""}</div>`;
    }
    box.innerHTML=html;
    box.querySelectorAll(".qsz").forEach(inp=>inp.oninput=drawBars);
    drawBars();
  };
  const drawBars=()=>{
    const total=476.94; let used=0;
    m.querySelectorAll(".ptsize").forEach(row=>{
      const inp=row.querySelector(".qsz");
      let v=parseFloat(inp.value);
      if(isNaN(v)||v<=0||inp.value==="剩余"){ row.querySelector(".fill").style.width="100%"; row.querySelector(".fill").style.background="#8aa6c8"; return; }
      used+=v;
      row.querySelector(".fill").style.width=Math.min(100,v/total*100)+"%";
      row.querySelector(".fill").style.background="#3266b0";
    });
  };
  const qmask=wins["dg"]?wins["dg"].el.querySelector(".dlg-mask:last-child"):null;
  if(qmask){
    qmask.querySelector("#qReset").onclick=buildParts;
    qmask.querySelector("#qCount").onchange=buildParts;
    qmask.querySelector("#qTable").onchange=buildParts;
    qmask.querySelector("#qEsp").onchange=buildParts;
    buildParts();
  }
}

function dgPartCtx(ev,i){
  ev.preventDefault(); ev.stopPropagation();

  if(!p) return;

    { ico:"🧹", label:"格式化当前分区", run:()=>toast("模拟环境：格式化仅作展示","ok") },
    { ico:"⭐", label:"激活当前分区（设为活动）", run:()=>{
        p.active=true;

        toast("已将 "+p.label+" 设为活动分区（主分区才能设为活动）","ok");
      } },
    { ico:"🔤", label:"指派新的驱动器号", run:()=>toast("模拟环境：盘符指派仅作展示","ok") },
    { sep:true },

        `<div style="font-size:13px;line-height:1.9">分区名称：${p.label}<br>文件系统：${p.fs}
         <br>分区类型：${p.type}<br>总大小：${fmt(p.sizeGB)} GB<br>已用：${p.used} GB</div>`, ()=>{}) },
    { ico:"🔄", label:"刷新", run:()=>renderDG() }
  ]);
}

function confirmDlg(msg,onYes){
  dlgBox("DiskGenius 确认",`<div style="font-size:13px;line-height:1.8">${msg}</div>`,()=>{ onYes(); });
}
function dgDelete(){
  if(dgSel<0){ toast("请先在分区列表中选中一个分区","err"); return; }
  const p=state.disks[0].parts[dgSel];
  confirmDlg(`确认要删除分区 <b>${p.label} (${fmt(p.sizeGB)}GB)</b> 吗？<br><br>分区上的所有数据将会丢失。`,
  ()=>{
    state.disks[0].parts.splice(dgSel,1); dgSel=-1;
    state.lastDelete={label:p.label,confirmed:true};
    if(window.SimExam) SimExam.emit('step','dg.delete',state.lastDelete);

}

/* 正式考试交卷：先把剩余事件补发，再交给服务端判分 */
function submitWinpeExam(){
  if(!window.SimExam || !SimExam.isExam()){ toast("当前不是考试模式","err"); return; }
  if(!confirm("确定要交卷吗？交卷后不能再修改，且本科目限考 1 次。")) return;
  SimExam.flush(false);
  SimExam.submit('user');
}
function renderExam(){
  const list=$("#examList"); if(!list)return;
  // 正式考试：显示服务端下发的任务清单（只含要做什么，不含判分逻辑），不显示本地对错
  if(isExamMode()){
    const items=(SIM_PAPER && SIM_PAPER.items)||[];
    list.innerHTML = items.length
      ? items.map((it,i)=>`<div class="exam-q"><b>第${i+1}项</b> ${it.name} <span style="color:#9fc">(${it.pts}分)</span></div>`).join("")
      : '<div style="color:#9ab;font-size:12px">任务清单加载中…</div>';
    const side=$("#examSideTitle"); if(side) side.textContent="📋 考试任务（"+items.length+" 项）";
    $("#examHead").textContent = (SIM_PAPER && SIM_PAPER.title) || "WinPE 装机维护模拟考试";
    $("#examBody").innerHTML = "请按左侧任务清单，在 <b>DiskGenius / Windows 安装器 / 图吧工具箱</b> 中依次完成操作，"
      + "全部完成后点左下角【交卷】。<br><br>正式考试期间不显示单题对错，成绩由服务器按操作步骤自动判定。";
    $("#examScore").innerHTML = "";
    return;
  }
  list.innerHTML=QUESTIONS.map((q,i)=>{
    const r=state.results[q.id];
    const tag=r? (r.score>=q.points*0.99?`<span class="tag done">通过 ${r.score}分</span>`:`<span class="tag fail">未通过 ${r.score}分</span>`)
              :`<span class="tag todo">待完成</span>`;
    return `<div class="exam-q ${state.examOpen===q.id?"active":""}" onclick="openQ(${q.id})"><b>第${i+1}题</b> ${q.title} <span style="color:#9fc">(${q.points}分)</span>${tag}</div>`;
  }).join("");
  if(state.examOpen){ showQ(state.examOpen); } else { $("#examScore").innerHTML=""; }
}
function openQ(id){ state.examOpen=id; renderExam(); focusWin("exam"); }
function showQ(id){
  const q=QUESTIONS.find(x=>x.id===id); if(!q)return;
  $("#examHead").textContent=`第${QUESTIONS.indexOf(q)+1}题 · ${q.title}（${q.points}分）`;
  $("#examBody").innerHTML=`<p>${q.desc}</p><div class="req"><ol style="padding-left:18px">${q.req.map(r=>`<li>${r}</li>`).join("")}</ol></div>
    <p style="color:#888;font-size:12px">💡 提示：打开桌面的 DiskGenius 或 Windows 安装器完成操作后，点击下方【立即判分】。</p>
    <button class="btn primary" style="margin-top:10px" onclick="gradeOne(${q.id})">立即判分</button>`;
  const r=state.results[q.id];
  renderScoreLine(q,r);
}
function renderScoreLine(q,r){
  const s=$("#examScore"); if(!s)return;
  if(!r){ s.innerHTML=`<span>本题尚未判分 · 满分 ${q.points} 分</span>`; return; }
  const ok=r.score>=q.points*0.99;
  s.innerHTML=`<span class="score-big ${ok?"":"bad"}">${r.score} / ${q.points} 分</span>
   <span>${ok?"✔ 操作完全正确！":"✘ 存在以下问题："}</span>
   <span style="font-size:12px;color:${ok?"#cde":"#ffc9c9"}">${ok?"":r.errors.join("；")}</span>`;
}
function gradeOne(id){
  const q=QUESTIONS.find(x=>x.id===id);
  const res=q.check(state);
  state.results[id]=res; saveState(); renderExam(); renderScoreLine(q,res);
  if(res.score>=q.points*0.99) toast(`第${QUESTIONS.indexOf(q)+1}题通过！得分 ${res.score}`,"ok");
  else toast(`本题得分 ${res.score}/${q.points}，详见错误提示`,"err");
}
function gradeAll(){
  QUESTIONS.forEach(q=>{ state.results[q.id]=q.check(state); });
  saveState(); renderExam();
  const total=QUESTIONS.reduce((s,q)=>s+(state.results[q.id]?.score||0),0);
  const pct=Math.round(total/TOTAL_POINTS*100);
  const pass=pct>=60;
  $("#examScore").innerHTML=`<span class="score-big ${pass?"":"bad"}">${total} / ${TOTAL_POINTS} 分（${pct}分）</span>
   <span style="font-size:15px">${pass?"🎉 考试通过！":"未达到60分及格线，请查看各题错误提示后重试。"}</span>`;
  toast(pass?"考试通过！":"考试未通过，请继续练习",pass?"ok":"err");
}

let cdmRunning=false;
/* cdmDoneAll 原来是模块级全局变量：只要跑过一次 All，重开窗口也不会重置，
   学生点一下"提交成绩"就能拿满分。已改为 state.cdmDoneAll，随 resetAll 清零。 */
function cdmRun(mode){
  if(cdmRunning){ toast("测试进行中，请等待","err"); return; }
  cdmRunning=true;
  const drive=document.querySelector("#cdmDrive").value;
  const count=+document.querySelector("#cdmCount").value;
  const size=document.querySelector("#cdmSize").value;
  document.querySelector("#cdmProg").style.display="block";
  let p=0;
  const total=mode==="all"?8:2;
  const cells=mode==="all"?[["cdmS1R",3400,"cdmS1W",2900],["cdmS2R",3100,"cdmS2W",2700],["cdmR1R",480,"cdmR1W",520],["cdmR2R",65,"cdmR2W",180]]
                          :(mode==="seq1m"?[["cdmS1R",3400,"cdmS1W",2900]]:[["cdmR1R",480,"cdmR1W",520]]);
  let ci=0;
  const timer=setInterval(()=>{
    p+=100/(total*10);
    document.querySelector("#cdmPF").style.width=Math.min(100,p)+"%";
    document.querySelector("#cdmStatus").textContent=`[${drive}] 正在测试 (${ci+1}/${total}) ...`;
    if(p>=(ci+1)*100/total && ci<cells.length){
      const c=cells[ci];
      document.querySelector("#"+c[0]).textContent=(c[1]*(0.95+Math.random()*0.1)).toFixed(2);
      document.querySelector("#"+c[2]).textContent=(c[3]*(0.95+Math.random()*0.1)).toFixed(2);
      ci++;
    }
    if(p>=100){
      clearInterval(timer);
      document.querySelector("#cdmStatus").textContent="✔ 测试完成 ["+drive+"] count="+count+" size="+size;
      document.querySelector("#cdmProg").style.display="none";
      cdmRunning=false;
      if(mode==="all") state.cdmDoneAll=true;
      if(window.SimExam) SimExam.emit('step','cdm.rundone',{mode:mode,drive:drive,count:count,size:size});
    }
  },120);
}

/**
 * 纯色画面。这一台"显示器"是**有问题**的：
 *   白色画面上有一个黑色暗点、黑色画面上有一个红色亮点。
 * 原实现只是铺一层纯色，屏幕上什么都没有，学生只能凭猜测选"无坏点"，
 * 题目本身不可验证。现在坏点真实可见，必须观察完白/黑两色才能发现。
 */
const SCREEN_DEFECTS = {
  white: [ {x:'42%', y:'36%', w:7, h:7, bg:'#000', kind:'暗点'} ],
  black: [ {x:'63%', y:'58%', w:7, h:7, bg:'#ff2222', kind:'亮点'} ]
};

function showPureColor(c){
  const map={red:"#e53935",green:"#43a047",blue:"#1e88e5",white:"#ffffff",black:"#111111"};
  if(scrOverlay) scrOverlay.remove();
  scrOverlay=document.createElement("div");
  scrOverlay.style.cssText=`position:fixed;inset:0;background:${map[c]};z-index:99999;`;
  let dots = "";
  (SCREEN_DEFECTS[c] || []).forEach(d=>{
    dots += `<div style="position:absolute;left:${d.x};top:${d.y};width:${d.w}px;height:${d.h}px;background:${d.bg}"></div>`;
  });
  scrOverlay.innerHTML=`<div style="position:absolute;top:12px;right:16px;background:rgba(0,0,0,.5);color:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:13px" onclick="scrExit()">✕ 退出 (ESC)</div>
   ${dots}
   <div style="position:absolute;bottom:16px;left:16px;color:${c==="white"?"#888":"rgba(255,255,255,.55)"};font-size:12px">纯色测试: ${({red:"红色",green:"绿色",blue:"蓝色",white:"白色",black:"黑色"})[c]} — 仔细观察是否有亮点 / 暗点</div>`;
  document.body.appendChild(scrOverlay);
}
function scrExit(){ if(scrOverlay){scrOverlay.remove();scrOverlay=null;} }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") scrExit(); });

/**
 * 烤机计时改为 **1:1 真实秒**。
 * 原实现是 1 真实秒 = 30 模拟秒，学生点"开始"等 2 秒就直接满足"≥60 秒"，
 * 题目要求形同虚设。现在要真等满 60 秒，同时也更符合真机烤机的认知。
 *（考试 30 分钟里占 1 分钟，可接受；练习模式想快进可改用标准模式说明。）
 */
function burnStartFn(){
  if(burnTimer) return;
  burnStart=Date.now();
  state.burnSimSec=0;
  document.querySelector("#burnGo").disabled=true;
  document.querySelector("#burnStop").disabled=false;
  document.querySelector("#burnStatus").textContent="烤机运行中… 1:1 真实秒计时，请烤满 60 秒";
  burnTimer=setInterval(()=>{
    const el=Math.round((Date.now()-burnStart)/1000);
    state.burnSimSec=el;
    document.querySelector("#burnTemp").textContent=(88+Math.round(Math.sin(el/3)*3))+" ℃";
    document.querySelector("#burnPower").textContent=(240+Math.round(Math.cos(el/4)*8))+" W";
    document.querySelector("#burnUsage").textContent="100 %";
    document.querySelector("#burnTime").textContent=Math.floor(el/60)+":"+String(el%60).padStart(2,"0");
  },1000);
  if(window.SimExam) SimExam.emit('step','burn.start',{at:Date.now()});
  toast("烤机已开始（真实秒计时）","ok");
}
function burnStopFn(){
  if(!burnTimer) return;
  clearInterval(burnTimer); burnTimer=null;
  const realSec=Math.round((Date.now()-burnStart)/1000);
  state.burnSimSec=realSec;                       // ← 原来是 realSec*30
  document.querySelector("#burnGo").disabled=false;
  document.querySelector("#burnStop").disabled=true;
  document.querySelector("#burnUsage").textContent="4 %";
  document.querySelector("#burnTemp").textContent="42 ℃";
  document.querySelector("#burnStatus").textContent="烤机已停止，实际烤机 "+state.burnSimSec+" 秒。"
    + (state.burnSimSec>=60 ? "可提交烤机报告。" : "不足 60 秒，提交后该项不计分。");
  if(window.SimExam) SimExam.emit('step','burn.stop',{durationSec:state.burnSimSec});
  toast("烤机已停止","ok");
}
function burnReport(){
  const sim=state.burnSimSec||0;
  const mode=document.querySelector("#burnMode").value;
  const m=mode.match(/Extreme/)?'Extreme':(mode.match(/Standard/)?"Standard":"Light");
  const th=document.querySelector("#burnThreads").value;
  const threads=th==="all"?"全部":(th==="half"?"一半":"单线程");
  // 必须真的烤满且已停止；否则提交也不给分（原来 stopped 只看 sim>0，等于白送）
  state.lastBurn={mode:m,threads,durationSec:sim,stopped:!burnTimer&&sim>=60};
  if(window.SimExam) SimExam.emit('step','burn.report',state.lastBurn);
  saveState(); refreshAll();
  toast(state.lastBurn.stopped ? "烤机报告已提交" : "已提交（未烤满 60 秒，该项不计分）",
        state.lastBurn.stopped ? "ok" : "err");
}

/* ============================================================
   MemTest86 —— 内存完整性检测
   原实现只弹提示。这里给出可运行的检测界面：进度条 + Pass/Errors
   计数，必须跑满至少 1 轮（约 12 秒）才能提交。
   ============================================================ */
let mtTimer=null, mtProgress=0, mtPasses=0, mtErrors=0, mtStartAt=0, mtDone=false;
const MT_PASS_SECONDS = 12;

function memtestResetUI(){
  if(mtTimer){ clearInterval(mtTimer); mtTimer=null; }
  mtProgress=0; mtPasses=0; mtErrors=0; mtStartAt=0; mtDone=false;
}
function openMemTest(){
  createWin("memtest","MemTest86 v9.4 (模拟)",820,580,`
   <div class="mt">
    <div class="mt-head"><span>内存检测 (MemTest86 模拟)</span><span class="mt-right">MemTest86 v9.4 · UEFI 引导</span></div>
    <pre class="mt-console" id="mtConsole">MemTest86 v9.4  (C) 2004-2023 PassMark Software
检测对象: HD0 之外的物理内存  ·  测试容量: <span id="mtSizeEcho">8 GB</span>
等待开始检测 …</pre>
    <div class="mt-stats">
      <div><label>Pass</label><b id="mtPass">0</b></div>
      <div><label>Errors</label><b id="mtErr" class="ok">0</b></div>
      <div><label>进度</label><b id="mtProg">0%</b></div>
      <div><label>用时</label><b id="mtTime">0:00</b></div>
    </div>
    <div class="mt-progress"><div class="mt-pf" id="mtPF"></div></div>
    <div class="mt-foot">
      <span>测试容量</span>
      <select id="mtSize" onchange="memtestEchoSize()"><option>4 GB</option><option selected>8 GB</option><option>16 GB</option></select>
      <button class="bigbtn" id="mtGo" onclick="memtestStart()">开始检测</button>
      <button class="btn" id="mtStop" onclick="memtestStop()" disabled>停止</button>
      <button class="btn primary" onclick="memtestReport()">提交报告</button>
    </div>
   </div>`);
  memtestResetUI();
  const w = wins["memtest"].el;
  w.querySelector(".mt-console").textContent =
    "MemTest86 v9.4  (C) 2004-2023 PassMark Software\n"
    + "检测对象: 物理内存 DIMM1 + DIMM2  ·  " + w.querySelector("#mtSize").value + "\n等待开始检测 …";
  memtestRender();
}
function memtestEchoSize(){
  const w=wins["memtest"]; if(!w) return;
  w.el.querySelector("#mtSizeEcho").textContent = w.el.querySelector("#mtSize").value;
}
function memtestRender(){
  const w=wins["memtest"]; if(!w) return;
  const el=w.el;
  el.querySelector("#mtPass").textContent=mtPasses;
  el.querySelector("#mtErr").textContent=mtErrors;
  el.querySelector("#mtErr").className = mtErrors? "bad":"ok";
  el.querySelector("#mtProg").textContent=Math.floor(mtProgress)+"%";
  el.querySelector("#mtPF").style.width=mtProgress+"%";
  const sec=mtStartAt?Math.floor((Date.now()-mtStartAt)/1000):0;
  el.querySelector("#mtTime").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}
function memtestStart(){
  if(mtTimer) return;
  mtStartAt=mtStartAt||Date.now();
  const w=wins["memtest"]; if(!w) return;
  w.el.querySelector("#mtGo").disabled=true;
  w.el.querySelector("#mtStop").disabled=false;
  w.el.querySelector(".mt-console").textContent += "\n开始检测 …  测试算法: 0 (Walking Ones) / 1 (Moving Inversions)\n";
  const tickMs=500;
  mtTimer=setInterval(()=>{
    if(!wins["memtest"]){ memtestResetUI(); return; }
    mtProgress += 100/(MT_PASS_SECONDS*1000/tickMs);
    if(mtProgress>=100){
      mtProgress=0; mtPasses++;
      const c=wins["memtest"].el.querySelector(".mt-console");
      c.textContent += "Pass "+mtPasses+" 完成，未发现错误 (Errors: 0)\n";
      c.scrollTop=c.scrollHeight;
    }
    memtestRender();
  },tickMs);
  memtestRender();
  toast("内存检测已开始（完整跑满 1 轮约 12 秒）","ok");
}
function memtestStop(){
  if(!mtTimer) return;
  clearInterval(mtTimer); mtTimer=null;
  mtDone=true;
  const w=wins["memtest"]; if(!w) return;
  w.el.querySelector("#mtGo").disabled=false;
  w.el.querySelector("#mtStop").disabled=true;
  w.el.querySelector(".mt-console").textContent += "检测已停止。累计 Pass: "+mtPasses+"，Errors: "+mtErrors+"\n";
  memtestRender();
  toast("内存检测已停止","ok");
}
function memtestReport(){
  if(mtTimer){ toast("请先点击【停止】再提交报告","err"); return; }
  state.lastMemtest = {passes:mtPasses, errors:mtErrors, done:mtDone, size:(wins["memtest"]?wins["memtest"].el.querySelector("#mtSize").value:"8 GB")};
  if(window.SimExam) SimExam.emit('step','memtest.report',state.lastMemtest);
  saveState(); refreshAll();
  toast(mtDone && mtPasses>=1 ? "内存检测报告已提交" : "已提交（未跑满 1 轮，该项不计分）",
        mtDone && mtPasses>=1 ? "ok" : "err");
}

/* ============================================================
   键盘测试 —— 真实捕获按键并高亮
   原实现只弹提示；这里做成可交互键盘图：按下即高亮，实时显示
   键名与键码，并标注考核要求 A/S/D/F/空格 是否已测到。
   ============================================================ */
const KBD_ROWS = [
  [{k:"`",l:"`"},{k:"1",l:"1"},{k:"2",l:"2"},{k:"3",l:"3"},{k:"4",l:"4"},{k:"5",l:"5"},{k:"6",l:"6"},{k:"7",l:"7"},{k:"8",l:"8"},{k:"9",l:"9"},{k:"0",l:"0"},{k:"-",l:"-"},{k:"=",l:"="},{k:"backspace",l:"⌫ 退格",w:2}],
  [{k:"tab",l:"Tab",w:1.5},{k:"q",l:"Q"},{k:"w",l:"W"},{k:"e",l:"E"},{k:"r",l:"R"},{k:"t",l:"T"},{k:"y",l:"Y"},{k:"u",l:"U"},{k:"i",l:"I"},{k:"o",l:"O"},{k:"p",l:"P"},{k:"[",l:"["},{k:"]",l:"]"},{k:"\\",l:"\\",w:1.5}],
  [{k:"caps",l:"Caps",w:1.8},{k:"a",l:"A"},{k:"s",l:"S"},{k:"d",l:"D"},{k:"f",l:"F"},{k:"g",l:"G"},{k:"h",l:"H"},{k:"j",l:"J"},{k:"k",l:"K"},{k:"l",l:"L"},{k:";",l:";"},{k:"'",l:"'"},{k:"enter",l:"Enter",w:2.2}],
  [{k:"shift",l:"Shift",w:2.3},{k:"z",l:"Z"},{k:"x",l:"X"},{k:"c",l:"C"},{k:"v",l:"V"},{k:"b",l:"B"},{k:"n",l:"N"},{k:"m",l:"M"},{k:",",l:","},{k:".",l:"."},{k:"/",l:"/"},{k:"shift_r",l:"Shift",w:2.7}],
  [{k:"ctrl",l:"Ctrl",w:1.4},{k:"win",l:"⊞ Win",w:1.1},{k:"alt",l:"Alt",w:1.1},{k:"space",l:"空格",w:6.2},{k:"alt_r",l:"Alt",w:1.1},{k:"win_r",l:"Win",w:1.1},{k:"menu",l:"Menu",w:1.1},{k:"ctrl_r",l:"Ctrl",w:1.4}],
];
let kbdTested = {}, kbdLast = "", kbdLastCode = "", kbdBound = false;

function kbdNorm(e){
  const k = e.key;
  if(k === " ") return "space";
  if(k === "CapsLock") return "caps";
  if(k === "Enter") return "enter";
  if(k === "Tab") return "tab";
  if(k === "Backspace") return "backspace";
  if(k === "Shift") return "shift";
  if(k === "Control") return "ctrl";
  if(k === "Alt") return "alt";
  if(k === "Meta") return "win";
  if(k === "ContextMenu") return "menu";
  if(k === "\\") return "\\";
  return String(k).toLowerCase();
}
function openKeyboardTest(){
  createWin("kbd","键盘测试 (模拟)",860,470,`
   <div class="kbd">
    <div class="kbd-info">
      <div><label>当前按键</label><b id="kbdLast">—</b></div>
      <div><label>键码 (keyCode)</label><b id="kbdCode">—</b></div>
      <div><label>已测按键数</label><b id="kbdCount">0</b></div>
      <div class="kbd-need"><label>考核要求</label><span id="kbdNeed"></span></div>
    </div>
    <div class="kbd-board" id="kbdBoard"></div>
    <div class="kbd-foot">
      <span class="kbd-hint">按下键盘按键，对应键位会高亮；请依次按下 A、S、D、F 与空格键。</span>
      <button class="btn primary" onclick="kbdSubmit()">提交报告</button>
    </div>
   </div>`);
  const board = wins["kbd"].el.querySelector("#kbdBoard");
  board.innerHTML = KBD_ROWS.map(row => '<div class="kbd-row">' + row.map(x =>
    `<div class="kbdkey" data-k="${x.k}" style="flex-grow:${x.w||1}">${x.l}</div>`).join("") + '</div>').join("");
  kbdResetUI();
  if(!kbdBound){ document.addEventListener("keydown", kbdOnKey, true); kbdBound = true; }
}
function kbdResetUI(){
  kbdTested = {}; kbdLast = ""; kbdLastCode = "";
  if(wins["kbd"]) kbdMark();
}
function kbdOnKey(e){
  const w = wins["kbd"];
  if(!w || w.min || w.el.style.display === "none") return;
  const k = kbdNorm(e);
  kbdTested[k] = true;
  kbdLast = e.key === " " ? "空格 (Space)" : e.key;
  kbdLastCode = e.keyCode;
  if(k === " " || k === "space") e.preventDefault();
  kbdMark();
}
function kbdMark(){
  const w = wins["kbd"]; if(!w) return;
  const el = w.el;
  el.querySelectorAll(".kbdkey").forEach(n=>{
    const base = n.dataset.k.replace(/_r$/, "");
    n.classList.toggle("hit", !!kbdTested[n.dataset.k] || !!kbdTested[base]);
  });
  el.querySelector("#kbdLast").textContent = kbdLast || "—";
  el.querySelector("#kbdCode").textContent = kbdLastCode || "—";
  el.querySelector("#kbdCount").textContent = Object.keys(kbdTested).length;
  el.querySelector("#kbdNeed").innerHTML = [["a","A"],["s","S"],["d","D"],["f","F"],["space","空格"]]
    .map(n=>`<span class="kn${kbdTested[n[0]]?" ok":""}">${n[1]}</span>`).join("");
}
function kbdSubmit(){
  state.lastKbd = {keys:Object.keys(kbdTested), done:true};
  if(window.SimExam) SimExam.emit('step','kbd.submit',state.lastKbd);
  saveState(); refreshAll();
  const need = ["a","s","d","f","space"];
  const ok = need.every(n=>kbdTested[n]);
  toast(ok ? "键盘检测报告已提交（要求的按键均已响应）" : "已提交（仍有要求按键未测到，该项不计分）",
        ok ? "ok" : "err");
}

function mouseRender(){
  const w = wins["mouse"]; if(!w) return;

  el.querySelector("#msLeft").textContent = mouseTested.left || 0;
  el.querySelector("#msRight").textContent = mouseTested.right || 0;
  el.querySelector("#msWheel").textContent = mouseTested.wheel || 0;
  el.querySelector("#msDbl").textContent = mouseTested.dbl || 0;

function bindMouseTest(){
  const w = wins["mouse"]; if(!w) return;
  const el = w.el;
  const area = el.querySelector("#mouseArea");
  const st = el.querySelector("#msStatus");
  const fig = el.querySelector("#mouseFig");
  const flash = (sel, txt)=>{
    const n = fig.querySelector(sel);
    if(n){ n.classList.add("on"); setTimeout(()=>n.classList.remove("on"), 200); }
    st.textContent = "检测到：" + txt;
  };
  area.addEventListener("contextmenu", e=>e.preventDefault());
  area.addEventListener("mousedown", e=>{
    e.preventDefault();
    if(e.button === 0){ mouseTested.left = (mouseTested.left||0)+1; flash(".mf-left","左键单击"); }
    else if(e.button === 2){ mouseTested.right = (mouseTested.right||0)+1; flash(".mf-right","右键单击"); }
    else if(e.button === 1){ mouseTested.wheel = (mouseTested.wheel||0)+1; flash(".mf-wheel","滚轮(中键)"); }
    mouseRender();
  });
  area.addEventListener("wheel", e=>{
    mouseTested.wheel = (mouseTested.wheel||0)+1;
    flash(".mf-wheel", "滚轮向" + (e.deltaY < 0 ? "上" : "下"));
    mouseRender();
  }, {passive:true});
  area.addEventListener("dblclick", e=>{
    mouseTested.dbl = (mouseTested.dbl||0)+1;
    st.textContent = "检测到：左键双击";
    mouseRender();
  });
}
function mouseSubmit(){
  state.lastMouse = {left:!!mouseTested.left, right:!!mouseTested.right,
                     wheel:!!mouseTested.wheel, dbl:!!mouseTested.dbl};
  if(window.SimExam) SimExam.emit('step','mouse.submit',state.lastMouse);
  saveState(); refreshAll();
  const ok = state.lastMouse.left && state.lastMouse.right && state.lastMouse.wheel && state.lastMouse.dbl;
  toast(ok ? "鼠标检测报告已提交（左键/右键/滚轮/双击均已响应）" : "已提交（仍有项目未测到，该项不计分）",
        ok ? "ok" : "err");
}

let SIM_PAPER = {};

function startExamMode(){
  const boot = window.SIM_BOOT || {};
  if(window.SimExam) SimExam.setWho((boot.student_name||"") + "　" + (boot.class_name||""));

  // 考试模式下屏蔽"重置考试环境"：否则学生做完不满意可以抹掉重来
  const hideReset = ()=>{

    });
  };
  hideReset();
  const mo = new MutationObserver(hideReset);

/* --- U 盘引导 → PE 加载 → 桌面就绪 --- */
function runBootChain(){
  const lines = [
    "Booting from USB HDD: SanDisk Cruzer Blade ...",
    "Loading WinPE image (boot.wim) ...",
    "Initializing hardware abstraction layer ...",
    "Starting Windows PE 10.0.19041 ..."
  ];
  const el = document.createElement("div");
  el.id = "peBoot";
  el.style.cssText = "position:fixed;inset:0;z-index:9600;background:#000;color:#cfd8e3;"
    + "font:14px/1.9 Consolas,monospace;padding:40px 48px;white-space:pre-wrap";
  document.body.appendChild(el);

  let i = 0;
  const t = setInterval(()=>{
    if(i < lines.length){ el.textContent += lines[i++] + "\n"; return; }
    clearInterval(t);
    el.textContent += "\n正在进入 PE 桌面 ...\n";
    if(window.SimExam) SimExam.emit('step','pe.loading_done',{});
    setTimeout(()=>{
      el.remove();
      state.peReady = true;
      if(window.SimExam) SimExam.emit('step','pe.desktop_ready',{});
      toast("WinPE 维护环境已就绪，双击桌面图标开始操作","ok");
      // 进入桌面后自动打开考试任务清单：否则学生不知道这一场要做哪些操作
      if(!wins["exam"]) openExam();
    }, 1200);
  }, 620);

  // 引导设备选择：装机时最关键的一步，单独埋点
  if(window.SimExam) SimExam.emit('step','boot.pick_usb',{ device:'USB HDD: SanDisk Cruzer Blade' });
}

(function initWinpe(){
  loadState(); buildDesktop(); buildStartMenu();

  if(!window.SimExam) return;   // 离线双击：保持原练习流程

  /* 必须等 DOMContentLoaded 之后再读 window.SIM_BOOT：
     服务端把 SIM_BOOT 注入在页面末尾，而本脚本在 body 里更靠前，
     同步执行时它还没定义，会被误判为"未登录"而降级成练习模式。 */
  const start = function(){
    const boot = window.SIM_BOOT || {};
    // 只有正式考试才需要服务端任务清单；练习/离线模式不请求，免得控制台刷 401。
    const paperP = boot.logged_in
      ? fetch('/api/sim/paper?type=winpe')
          .then(r => r.ok ? r.json() : null)
          .then(d => { SIM_PAPER = (d && d.paper) ? d.paper : {}; })
          .catch(()=>{ SIM_PAPER = {}; })
      : Promise.resolve();

    paperP.then(()=>{
      SimExam.boot({
        simType: "winpe",
        onReady: function(S){ if(S.mode === "exam") startExamMode(); },
        onBlocked: function(){ setTimeout(function(){ location.href = "/portal"; }, 4000); }
      });
    });
  };

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
